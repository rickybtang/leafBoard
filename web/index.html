<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Leaf2 看板</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; color: #000; }
    body {
      min-height: 100vh;
      padding: 3vh 5vw;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: none;
    }
    header { border-bottom: 5px solid #000; padding-bottom: 1.5vh; }
    #time { font-size: 17vw; font-weight: 800; line-height: .88; letter-spacing: -.05em; }
    #date { margin-top: 1.2vh; font-size: 4.5vw; font-weight: 700; }
    main { display: grid; gap: 1.5vh; margin-top: 2vh; }
    section { border: 4px solid #000; padding: 1.8vh 3.5vw; }
    h2 { margin: 0 0 .6vh; font-size: 4vw; }
    .value { font-size: 5.3vw; font-weight: 800; }
    .note { margin-top: .4vh; font-size: 3vw; line-height: 1.25; }
    footer { margin-top: 1.5vh; font-size: 2.5vw; }
    .error { background: #000; color: #fff; }
  </style>
</head>
<body>
  <header>
    <div id="time">--:--</div>
    <div id="date">正在读取时间…</div>
  </header>
  <main>
    <section>
      <h2>Leaf2</h2>
      <div class="value" id="battery">正在读取…</div>
    </section>
  </main>
  <footer id="updated">等待首次刷新</footer>
  <script>
    async function refresh() {
      try {
        const response = await fetch('/api/dashboard', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        document.getElementById('time').textContent = data.time;
        document.getElementById('date').textContent = data.date + ' · ' + data.weekday;
        document.getElementById('battery').textContent = data.device.connected
          ? (data.device.level == null ? '已连接' : data.device.level + '%')
          : '连接已断开';
        document.getElementById('updated').textContent = '更新于 ' + data.updatedAt + ' · 每分钟刷新';
        document.body.classList.remove('error');
      } catch (error) {
        document.getElementById('updated').textContent = '数据刷新失败：' + error.message;
        document.body.classList.add('error');
      }
    }
    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
